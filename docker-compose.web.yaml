services:
  damascus-ui:
    build:
      context: ./web
      dockerfile: Dockerfile

    container_name: damascus-ui
    restart: always

    ports:
      - "127.0.0.1:4000:80"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PORT: "80"
      BACKEND_URL: "http://host.docker.internal:8080/api/"
